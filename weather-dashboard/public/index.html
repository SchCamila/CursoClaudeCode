<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SkySense — Clima com IA</title>
<meta name="description" content="Dashboard de clima em tempo real com insights gerados por IA." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌤️</text></svg>" />
<link rel="stylesheet" href="styles.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body class="cond-default">
  <div class="bg-glow" id="bgGlow"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">🌤️</span>
      <span class="brand-name">SkySense</span>
    </div>

    <div class="search-wrap">
      <input id="citySearch" class="search-input" type="text" placeholder="Buscar cidade..." autocomplete="off" />
      <div id="searchResults" class="search-results hidden"></div>
    </div>

    <button id="geoBtn" class="icon-btn" title="Usar minha localização">📍</button>
  </header>

  <main class="container">
    <section id="heroCard" class="hero-card">
      <div class="hero-skeleton" id="heroSkeleton">
        <div class="skel-line w60"></div>
        <div class="skel-line w40"></div>
      </div>
      <div class="hero-content hidden" id="heroContent">
        <div class="hero-top">
          <div>
            <div class="hero-city" id="heroCity">—</div>
            <div class="hero-updated" id="heroUpdated">—</div>
          </div>
          <div class="hero-icon" id="heroIcon">☀️</div>
        </div>
        <div class="hero-temp" id="heroTemp">--°</div>
        <div class="hero-desc" id="heroDesc">—</div>
        <div class="hero-stats">
          <div class="stat">
            <span class="stat-label">Sensação</span>
            <span class="stat-value" id="statFeels">--°</span>
          </div>
          <div class="stat">
            <span class="stat-label">Umidade</span>
            <span class="stat-value" id="statHumidity">--%</span>
          </div>
          <div class="stat">
            <span class="stat-label">Vento</span>
            <span class="stat-value" id="statWind">-- km/h</span>
          </div>
          <div class="stat">
            <span class="stat-label">Máx / Mín</span>
            <span class="stat-value" id="statMinMax">--° / --°</span>
          </div>
        </div>
      </div>
    </section>

    <section class="ai-card" id="aiCard">
      <div class="ai-card-header">
        <div class="ai-title">
          <span class="ai-badge">✨ IA</span>
          <span>Insight gerado em tempo real</span>
        </div>
        <button id="refreshInsight" class="ghost-btn" title="Gerar novo insight">↻</button>
      </div>
      <div class="ai-body" id="aiBody">
        <div class="ai-skeleton">
          <div class="skel-line w90"></div>
          <div class="skel-line w70"></div>
        </div>
      </div>
      <div class="ai-footer" id="aiSource"></div>
    </section>

    <section class="chart-card">
      <div class="chart-card-header">Próximas 24 horas</div>
      <div class="chart-wrap">
        <canvas id="hourlyChart" height="90"></canvas>
      </div>
    </section>

    <section class="forecast-card">
      <div class="chart-card-header">Próximos 7 dias</div>
      <div class="forecast-strip" id="forecastStrip">
        <div class="skel-line w90"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    Dados de <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> ·
    Insights por <a href="https://www.anthropic.com/claude" target="_blank" rel="noopener">Claude</a> ·
    Feito com Claude Code
  </footer>

  <script src="app.js"></script>
</body>
</html>
