<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: #10151a;
    color: #e7f0e7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px;
    box-sizing: border-box;
  }
  h1 {
    margin: 0;
    font-size: 1.5rem;
    letter-spacing: 0.05em;
  }
  #scoreboard {
    display: flex;
    gap: 24px;
    font-size: 1.1rem;
  }
  #scoreboard span {
    font-weight: 600;
    color: #7be07b;
  }
  #board {
    background: #0a0e12;
    border: 4px solid #2e7d32;
    border-radius: 8px;
    box-shadow: 0 0 24px rgba(46, 125, 50, 0.4);
  }
  #message {
    min-height: 1.5em;
    font-size: 1rem;
    color: #f2c14e;
    text-align: center;
  }
  #controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 48px);
    grid-template-rows: repeat(3, 48px);
    gap: 4px;
  }
  .dpad button {
    font-size: 1.2rem;
    background: #1b2530;
    color: #e7f0e7;
    border: 1px solid #2e7d32;
    border-radius: 6px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .dpad button:active {
    background: #2e7d32;
  }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #restart-inline { grid-column: 2; grid-row: 2; font-size: 0.9rem; }
  #right { grid-column: 3; grid-row: 2; }
  #down { grid-column: 2; grid-row: 3; }
  #hint {
    font-size: 0.85rem;
    color: #8fa08f;
    text-align: center;
  }
  button#restart {
    margin-top: 4px;
    padding: 8px 20px;
    font-size: 1rem;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button#restart:hover {
    background: #388e3c;
  }
</style>
</head>
<body>
  <h1>🐍 SNAKE</h1>
  <div id="scoreboard">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
  </div>
  <canvas id="board" width="400" height="400"></canvas>
  <div id="message"></div>
  <button id="restart">Restart</button>
  <div id="controls">
    <div class="dpad">
      <button id="up">▲</button>
      <button id="left">◀</button>
      <button id="restart-inline">⟳</button>
      <button id="right">▶</button>
      <button id="down">▼</button>
    </div>
    <div id="hint">Arrow keys / WASD to move. Space to pause.</div>
  </div>

<script>
(function () {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const messageEl = document.getElementById('message');
  const restartBtn = document.getElementById('restart');
  const restartInlineBtn = document.getElementById('restart-inline');

  const GRID_SIZE = 20;
  const TILE = canvas.width / GRID_SIZE;
  const STEP_MS = 120;

  let snake, direction, nextDirection, food, score, best, gameOver, paused, timerId;

  const BEST_KEY = 'snake_best_score';

  function loadBest() {
    const stored = parseInt(localStorage.getItem(BEST_KEY), 10);
    return Number.isFinite(stored) ? stored : 0;
  }

  function saveBest(value) {
    localStorage.setItem(BEST_KEY, String(value));
  }

  function randomFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * GRID_SIZE),
        y: Math.floor(Math.random() * GRID_SIZE),
      };
    } while (snake.some(seg => seg.x === pos.x && seg.y === pos.y));
    return pos;
  }

  function resetGame() {
    snake = [
      { x: 9, y: 10 },
      { x: 8, y: 10 },
      { x: 7, y: 10 },
    ];
    direction = { x: 1, y: 0 };
    nextDirection = { x: 1, y: 0 };
    score = 0;
    gameOver = false;
    paused = false;
    best = loadBest();
    food = randomFood();
    scoreEl.textContent = score;
    bestEl.textContent = best;
    messageEl.textContent = '';
    if (timerId) clearInterval(timerId);
    timerId = setInterval(tick, STEP_MS);
  }

  function endGame() {
    gameOver = true;
    clearInterval(timerId);
    if (score > best) {
      best = score;
      saveBest(best);
      bestEl.textContent = best;
      messageEl.textContent = `Game over! New best score: ${best}. Press Restart to play again.`;
    } else {
      messageEl.textContent = `Game over! Score: ${score}. Press Restart to play again.`;
    }
  }

  function tick() {
    if (paused || gameOver) return;

    direction = nextDirection;
    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y,
    };

    if (
      head.x < 0 || head.x >= GRID_SIZE ||
      head.y < 0 || head.y >= GRID_SIZE ||
      snake.some(seg => seg.x === head.x && seg.y === head.y)
    ) {
      endGame();
      draw();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      food = randomFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    ctx.fillStyle = '#0a0e12';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#e63946';
    ctx.fillRect(food.x * TILE, food.y * TILE, TILE, TILE);

    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? '#7be07b' : '#2e7d32';
      ctx.fillRect(seg.x * TILE + 1, seg.y * TILE + 1, TILE - 2, TILE - 2);
    });

    if (paused && !gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#f2c14e';
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
    }
  }

  function setDirection(x, y) {
    if (gameOver) return;
    if (direction.x === -x && direction.y === -y) return;
    if (direction.x === x && direction.y === y && (nextDirection.x !== x || nextDirection.y !== y)) return;
    nextDirection = { x, y };
  }

  function togglePause() {
    if (gameOver) return;
    paused = !paused;
    draw();
  }

  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': setDirection(0, -1); e.preventDefault(); break;
      case 'ArrowDown': case 's': case 'S': setDirection(0, 1); e.preventDefault(); break;
      case 'ArrowLeft': case 'a': case 'A': setDirection(-1, 0); e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': setDirection(1, 0); e.preventDefault(); break;
      case ' ': togglePause(); e.preventDefault(); break;
    }
  });

  document.getElementById('up').addEventListener('click', () => setDirection(0, -1));
  document.getElementById('down').addEventListener('click', () => setDirection(0, 1));
  document.getElementById('left').addEventListener('click', () => setDirection(-1, 0));
  document.getElementById('right').addEventListener('click', () => setDirection(1, 0));

  restartBtn.addEventListener('click', resetGame);
  restartInlineBtn.addEventListener('click', resetGame);

  resetGame();
  draw();
})();
</script>
</body>
</html>
